<!-- Standalone-bundle asset manifest: these images are referenced as strings in JS/JSX,
     so the inliner can't auto-discover them. RES() resolves each to a blob URL when bundled,

<meta name="ext-resource-dependency" content="assets/logotype-mark-black.png" data-resource-id="logo-black" />
<script>
(function(){
  // Static path -> resource-id map (must match the data-resource-id values above).
  // The inliner strips the <meta> tags at runtime, so the map can't be read from them.
  var map = {
    "assets/posters/the-steak.jpg":"poster-steak",
    "assets/posters/padre.jpg":"poster-padre",
    "assets/posters/il-mare-breve.jpg":"poster-mare",
    "assets/posters/playing-god.jpg":"poster-god",
    "assets/jury/alessio-boni.webp":"jury-boni",
    "assets/jury/hilary-tiscione.jpg":"jury-tiscione",
    "assets/jury/erika-ponti.webp":"jury-ponti",
    "assets/jury/daniele-pini.png":"jury-pini",
    "assets/guests/naja.jpg":"guest-naja",
    "assets/guests/carrieri.jpg":"guest-carrieri",
    "assets/guests/tufarulo.jpg":"guest-tufarulo",
    "assets/guests/canovi.jpg":"guest-canovi",
    "assets/atmosphere/reel-sorrentino.png":"reel-sorrentino",
    "assets/atmosphere/reel-mastandrea.png":"reel-mastandrea",
    "assets/atmosphere/reel-samani.png":"reel-samani",
    "assets/atmosphere/foyer.jpg":"atmo-foyer",
    "assets/atmosphere/sonorizzazione-annoni.png":"atmo-sonor",
    "assets/atmosphere/award-experimental.jpg":"atmo-award",
    "assets/logotype-mark-white.png":"logo-white",
    "assets/partners/comune-bergamo-crest.png":"partner-comune-bergamo",
    "assets/partners/conca-verde.png":"partner-conca-verde",
    "assets/partners/alpha-charlie.png":"partner-alpha-charlie",
    "assets/partners/mandelli-arte.png":"partner-mandelli-arte",
    "assets/logotype-footer-white.png":"logo-footer-white",
    "assets/logotype-mark-black.png":"logo-black"
  };
  // RES(path): blob URL when bundled offline, else the original path.
  window.RES = function(p){
    if (!p) return p;
    var id = map[p];
    if (id && window.__resources && window.__resources[id]) return window.__resources[id];
    return p;
  };
})();
</script>
